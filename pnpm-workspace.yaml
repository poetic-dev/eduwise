packages:
  - "client"
  - "server"
# pnpm 11 defaults minimumReleaseAge to 1440 (1 day), which blocks the
# project's own freshly-published @fusorb/facet-* packages on first use.
minimumReleaseAge: 0
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  # Pinned @fusorb/facet-* workspace versions (latest stable). Exempt so
  # pnpm's minimumReleaseAge gate doesn't block fresh publishes on install.
  - '@fusorb/facet-components@3.1.0'
  - '@fusorb/facet-layout@1.6.0'
  - '@fusorb/facet-tokens@1.5.0'
patchedDependencies:
  spawn-command: patches/spawn-command.patch
